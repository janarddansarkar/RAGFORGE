[project]
name = "ragforge"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "deepeval>=4.2.7",
    "langchain-chroma>=1.1.0",
    "langchain-core>=1.6.6",
    "langchain-text-splitters>=1.1.2",
    "litellm>=1.109.0",
    "pymupdf>=1.28.2",
    "rank-bm25>=0.2.2",
    "streamlit>=1.66.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.uv]
package = false  # an app, not a library: nothing is built or installed

# Tests import the project modules (src/ and the project root for eval/ and metrics/).
[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
