[project]
name = "ragforge"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "deepeval>=4.2.7",
    "langchain>=1.4.3",
    "langchain-chroma>=1.1.0",
    "langchain-core>=1.6.6",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.12",
    "ollama>=0.6.3",
    "pymupdf>=1.28.2",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.1.0",
    "streamlit>=1.66.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# src/ holds plain modules (config, vectorstore, retriever); put it on the import path.
[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]

# Tests import the project modules (src/ and the project root for eval/ and metrics/).
[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
