# RAGForge settings - the single place for all project configuration.

# ---- Models ----
# Every model is hosted and called through LiteLLM: write it with a provider prefix
# (openai/..., anthropic/..., gemini/...). Nothing runs on this machine. These are the defaults
# for the command line (set OPENAI_API_KEY, or the key of the provider you use).
# The web app lets each user pick a provider and bring their own key (src/providers.py).
embedding_model = "openai/text-embedding-3-small"  # each embedding model gets its own vector store
llm_model = "openai/gpt-4o"  # contextual notes, query transforms, answers
max_new_tokens = 256        # longest reply the LLM writes
reranker_model = "openai/gpt-4o-mini"  # the chat model when guard_model = "openai/gpt-4o-mini"  # checks every question for prompt injection and other malicious input (src/guardrails.py)
stt_model = "openai/whisper-1"  # hears spoken questions in the UI ("" = no voice input)

# ---- Chunking (each combination of these settings gets its own vector store) ----
collection_name = "ragforge"    # the chunking settings and the embedding model are added to it
contextual = true                # true: an LLM adds a context note to every chunk (slow to build)
chunk_size = 600                 # characters
chunk_overlap = 90

# ---- Retrieval ----
# Methods: dense, bm25, hybrid, hybrid_rerank, multi_query_hybrid_rerank
default_method = "hybrid_rerank"  # used by retrieve() when no method is given
top_k = 5        # results returned to the caller
rerank_workers = 4  # chunks the reranker scores at the same time (1 = one by one)
fetch_k = 20     # candidates gathered before fusion / reranking
rrf_k = 60       # RRF constant: score = 1 / (rrf_k + rank)

# ---- Input guardrail (src/guardrails.py) ----
input_guard = true      # false: skip the check 
guard_max_chars = 1000  # longer questions are blocked

# ---- Session cache (src/cache.py) ----
use_cache = true         # a question similar to an earlier one in this session reuses its answer
cache_threshold = 0.95   # how alike two questions must be (cosine, 0-1); higher = fewer reuses

memory_turns = 3  # chat: how many past question/answer pairs the model remembers
num_queries = 3  # multi_query: extra phrasings the LLM writes per question
