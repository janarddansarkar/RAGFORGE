# RAGForge settings - the single place for all project configuration.

# ---- Folders (relative to the project folder) ----
data_dir = "documents"  # source PDFs
vs_dir = "vs"           # Chroma vector store

# ---- Models (all served by Ollama: free, local, offline once pulled with `ollama pull <name>`) ----
ollama_host = "http://localhost:11434"  # a server's Ollama works too (it has no login: keep it private)
ollama_keep_alive = "30m"               # how long Ollama keeps a model in memory after use (its default, 5m, reloads models between questions)
ollama_num_ctx = 8192                   # context window; Ollama's default (4096) is too small for 5 chunks
embedding_model = "bge-m3"  # changing it requires: uv run python src/vectorstore.py --rebuild
llm_model = "qwen2.5:3b"    # contextual notes, query transforms, answers
max_new_tokens = 256        # longest reply the LLM writes
reranker_model = "qwen2.5:3b"  # an LLM scores each chunk 0-10 (Ollama has no cross-encoder reranker)
guard_model = "mistral:7b"     # checks every question for prompt injection and other malicious input (src/guardrails.py)
stt_model = "small"            # faster-whisper model (tiny | base | small | medium) that hears spoken questions in the UI

# ---- Chunking (changing any of these requires: uv run python src/vectorstore.py --rebuild) ----
# Each strategy gets its own collection in ./vs, so several can exist side by side.
collection_name = "ragforge"    # the strategy name is added to it
chunking_strategy = "recursive"  # recursive | semantic
contextual = false               # true: an LLM adds a context note to every chunk (slow to build)
chunk_size = 1000                # recursive: characters
chunk_overlap = 150
semantic_percentile = 90         # semantic: break where the similarity drop is in the top 10%
semantic_max_chars = 1500        # semantic: hard limit on chunk length

# ---- Retrieval ----
# Methods: dense, bm25, hybrid, dense_rerank, hybrid_rerank
default_method = "hybrid_rerank"  # used by retrieve() when no method is given
methods = [                       # pipelines the eval / demo run
    "dense",
    "bm25",
    "hybrid",
    "dense_rerank",
    "hybrid_rerank",
]
top_k = 5        # results returned to the caller
rerank_workers = 4  # chunks the reranker scores at the same time (1 = one by one)
fetch_k = 20     # candidates gathered before fusion / reranking
rrf_k = 60       # RRF constant: score = 1 / (rrf_k + rank)

# ---- Retriever eval ----
golden_file = "golden_data/rag_retriever_golden_dataset_45.json"
eval_ks = [1, 3, 5, 10]  # Recall@K and HitRate@K
precision_k = 5          # Precision@K
compare_methods = ["dense", "bm25", "hybrid_rerank"]  # retrieval methods used to compare chunking

# ---- Input guardrail (src/guardrails.py) ----
input_guard = true      # false: skip the check (the eval never uses it)
guard_max_chars = 1000  # longer questions are blocked

# ---- Session cache (src/cache.py) ----
use_cache = true         # a question similar to an earlier one in this session reuses its answer
cache_threshold = 0.95   # how alike two questions must be (cosine, 0-1); higher = fewer reuses

memory_turns = 3  # chat: how many past question/answer pairs the model remembers
num_queries = 3  # multi_query: extra phrasings the LLM writes per question

# ---- eval/find_best.py ----
# It tunes on 2 of every 3 golden queries and confirms the winner on the rest.
search_methods = [               # stage 2: pipelines to compare (LLM ones are slow)
    "dense",
    "bm25",
    "hybrid",
    "dense_rerank",
    "hybrid_rerank",
    "rewrite_hybrid_rerank",
    "multi_query_hybrid_rerank",
    "hyde_hybrid_rerank",
]
rerankers = [                    # stage 3: Ollama chat models that rerank (an LLM scores each chunk 0-10)
    "qwen2.5:1.5b",
    "qwen2.5:3b",
    "llama3.2:3b",
]
embedders = [                    # stage 2: Ollama embedding models
    "bge-m3",
    "nomic-embed-text",
    "mxbai-embed-large",
    "all-minilm",
]
generators = [                   # stage 5: Ollama answer models, scored on the golden pages
    "qwen2.5:3b",
    "llama3.2:3b",
    "gemma3:4b",
]
generator_metric = "answer_correctness"  # generators are ranked by this
generator_margin = 0.03                  # within this of the best counts as a tie; the faster one wins
primary_metric = "MRR"        # candidates are ranked by this
tie_break_metric = "Recall@5"
tie_margin = 0.01             # within this of the best counts as a tie; the faster one wins

# ---- eval/generator_eval.py ----
# The judge should be a different, stronger model than the generator (llm_model).
judge_model = "mistral:7b"  # also scores the RAG triad live in the UI (eval/rag_triad_eval.py)

# Chunking variants for eval/chunking_compare.py (and find_best.py stage 1). Each one overrides the chunking settings above.
# Keep this at the end of the file (a TOML array of tables).
[[chunking_variants]]
chunking_strategy = "recursive"
contextual = false

[[chunking_variants]]
chunking_strategy = "semantic"
contextual = false

[[chunking_variants]]
chunking_strategy = "recursive"
contextual = true
